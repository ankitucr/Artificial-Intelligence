<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pika - Holographic AGI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* ══ TOKENS ══════════════════════════════ */
:root {
  --bg: #02050a; /* Deep void background */
  --s1: #0f172a;
  --s2: #1e293b;
  --b1: rgba(255,255,255,0.05);
  --b2: rgba(255,255,255,0.1);
  --c: #00f0ff; /* Hologram Cyan */
  --v: #a78bfa;
  --r: #fb7185;
  --g: #10b981; /* Emerald Green */
  --g-bright: #39ff14; /* Neon Green for features */
  --a: #fbbf24; /* Neural Yellow */
  --t1: #f8fafc;
  --t2: #94a3b8;
  --t3: #475569;
  --rad: 16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100dvh; overflow: hidden; background: var(--bg); color: var(--t1); font-family: 'Inter', sans-serif; -webkit-text-size-adjust: 100%; }

/* ══ AMBIENT GLOW ════════════════════════ */
.amb { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.amb-b { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; }
.ab1 { width: 90vw; height: 90vw; background: radial-gradient(circle, var(--c), transparent 70%); top: -25%; left: -25%; animation: bf1 20s ease-in-out infinite; }
.ab2 { width: 70vw; height: 70vw; background: radial-gradient(circle, var(--g), transparent 70%); bottom: -15%; right: -15%; animation: bf2 25s ease-in-out infinite; }
@keyframes bf1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(5%, 10%); } }
@keyframes bf2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-5%, -5%); } }

/* ══ APP SHELL ═══════════════════════════ */
.app { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; background: rgba(2, 5, 10, 0.7); backdrop-filter: blur(12px); }

/* ══ TOPBAR ═════════════════════════════ */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-shrink: 0; border-bottom: 1px solid var(--b1); }
.tl { display: flex; align-items: center; gap: 10px; }
.t-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(57,255,20,0.12)); border: 1px solid var(--b2); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.t-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; color: var(--t1); }
.t-sub { font-size: 10px; color: var(--t3); letter-spacing: 1px; text-transform: uppercase; }
.conn { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--s1); border: 1px solid var(--b1); border-radius: 99px; font-size: 10px; color: var(--t3); font-weight: 500; }
.conn-led { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); transition: all 0.3s; }
.conn-led.ok { background: var(--c); box-shadow: 0 0 8px var(--c); }
.conn-led.err { background: var(--r); box-shadow: 0 0 8px var(--r); }

/* ══ AVATAR AREA ════════════════════════ */
.av-area { flex-grow: 1; flex-shrink: 0; flex-basis: 48vh; min-height: 280px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

.face-wrap { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; }
canvas#faceCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

.base-plate { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); width: 85%; height: 50px; border-radius: 50%; border: 1px solid rgba(0, 240, 255, 0.25); background: radial-gradient(ellipse, rgba(0, 240, 255, 0.06), transparent 65%); box-shadow: 0 0 25px rgba(0, 240, 255, 0.1) inset; pointer-events: none; }
.base-ring { position: absolute; bottom: 13%; left: 50%; transform: translateX(-50%); width: 45%; height: 12px; border-radius: 50%; border-bottom: 2px solid var(--c); filter: blur(1.5px); animation: pulse-ring 2s infinite; pointer-events: none; }
@keyframes pulse-ring { 0%, 100% { opacity: 0.2; transform: translateX(-50%) scale(0.85); } 50% { opacity: 1; transform: translateX(-50%) scale(1.15); box-shadow: 0 5px 15px var(--c); } }

.av-status { position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.av-status h2 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 300; letter-spacing: 3px; color: var(--c); text-shadow: 0 0 12px var(--c); margin-bottom: 2px; text-transform: uppercase; }
.av-status p { font-size: 9px; color: var(--t2); letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; }

/* ══ METRICS BAR ════════════════════════ */
.statbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(15, 23, 42, 0.8); border-top: 1px solid var(--b1); border-bottom: 1px solid var(--b1); gap: 10px; }
.metric { display: flex; align-items: center; gap: 8px; }
.ring { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; position: relative; }
.ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--b2); }
.ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--c); border-right-color: var(--c); transform: rotate(45deg); }
.ring.green::after { border-top-color: var(--g); border-right-color: var(--g); transform: rotate(-45deg); }
.m-info { display: flex; flex-direction: column; }
.m-lbl { font-size: 9px; color: var(--t3); letter-spacing: 1px; }
.m-val { font-size: 12px; color: var(--t1); font-weight: 500; font-family: 'Space Grotesk', sans-serif; }

.btn-evo { padding: 8px 16px; background: linear-gradient(135deg, rgba(57,255,20,0.1), rgba(0,240,255,0.1)); border: 1px solid rgba(57,255,20,0.3); border-radius: 8px; color: var(--g-bright); font-size: 11px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn-evo:active { background: rgba(57,255,20,0.2); transform: scale(0.95); }

/* ══ MESSAGES AREA ══════════════════════ */
.msgs { flex-grow: 1; flex-shrink: 1; flex-basis: 0; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msgs::-webkit-scrollbar { display: none; }

.msg { display: flex; flex-direction: column; gap: 4px; animation: slideUp 0.3s ease; max-width: 85%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.pika { align-self: flex-start; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mmeta { font-size: 10px; color: var(--t3); padding: 0 4px; }
.mbub { padding: 12px 16px; font-size: 14px; line-height: 1.5; word-break: break-word; border-radius: 16px; }
.msg.pika .mbub { background: rgba(30, 41, 59, 0.7); border: 1px solid var(--b2); border-top-left-radius: 4px; color: var(--t1); }
.msg.user .mbub { background: linear-gradient(135deg, rgba(0,240,255,0.12), rgba(0,240,255,0.03)); border: 1px solid rgba(0,240,255,0.2); border-top-right-radius: 4px; color: var(--t1); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; margin-top: auto; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 8px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--b2); border-radius: 99px; color: var(--t2); font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
.chip:active { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.4); color: var(--c); }

/* ══ INPUT AREA ═════════════════════════ */
.inp-area { flex-shrink: 0; padding: 12px 16px max(16px, env(safe-area-inset-bottom)); background: rgba(2, 5, 10, 0.95); border-top: 1px solid var(--b1); }
.inp-row { display: flex; gap: 10px; align-items: flex-end; }
.inp-box { flex: 1; background: var(--s1); border: 1px solid var(--b2); border-radius: 24px; transition: all 0.2s; display: flex; align-items: center; padding: 0 4px; }
.inp-box:focus-within { border-color: rgba(0,240,255,0.4); box-shadow: 0 0 10px rgba(0,240,255,0.1); }
textarea { width: 100%; background: transparent; border: none; outline: none; resize: none; color: var(--t1); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.4; padding: 12px; max-height: 100px; overflow-y: auto; }
textarea::placeholder { color: var(--t3); }

.ibtn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; background: var(--s2); color: var(--t2); transition: 0.2s; }
.ibtn-send { background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(0,240,255,0.05)); border: 1px solid rgba(0,240,255,0.3); color: var(--c); }
.ibtn-send:active { background: var(--c); color: #000; }
.ibtn-mic { background: rgba(251,113,133,0.1); border: 1px solid rgba(251,113,133,0.2); color: var(--r); }
.ibtn-mic.rec { background: var(--r); color: #fff; animation: pulse-mic 1s infinite; }
@keyframes pulse-mic { 0% { box-shadow: 0 0 0 0 rgba(251,113,133,0.4); } 70% { box-shadow: 0 0 0 15px rgba(251,113,133,0); } 100% { box-shadow: 0 0 0 0 rgba(251,113,133,0); } }
.vhint { text-align: center; font-size: 11px; color: var(--c); height: 16px; margin-top: 6px; opacity: 0; transition: 0.3s; }
</style>
</head>
<body>

<div class="amb">
  <div class="amb-b ab1"></div>
  <div class="amb-b ab2"></div>
</div>

<div class="app">

  <div class="topbar">
    <div class="tl">
      <div class="t-icon">🧠</div>
      <div>
        <div class="t-name">Pika Neural</div>
        <div class="t-sub">AGI V.4.0 Online</div>
      </div>
    </div>
    <div class="conn">
      <div class="conn-led ok" id="connLed"></div>
      <span id="connTxt">SYNCED</span>
    </div>
  </div>

  <div class="av-area" id="avContainer">
    <div class="base-plate"></div>
    <div class="base-ring"></div>
    
    <div class="face-wrap">
      <canvas id="faceCanvas"></canvas>
    </div>

    <div class="av-status">
      <h2 id="avStatusText">READY</h2>
      <p>Matrix Interface Active</p>
    </div>
  </div>

  <div class="statbar">
    <div class="metric">
      <div class="ring">77%</div>
      <div class="m-info"><span class="m-lbl">MEMORY</span></div>
    </div>
    <div class="metric">
      <div class="ring green">98%</div>
      <div class="m-info"><span class="m-lbl">SYNC</span></div>
    </div>
    <button class="btn-evo" id="btnEvo">⚡ Evolve</button>
  </div>

  <div class="msgs" id="msgs">
    <div class="msg pika">
      <div class="mmeta">Pika · Now</div>
      <div class="mbub">
        Hey Ankit! 👋 Mera ultimate 3D Plexus avatar load ho chuka hai.<br>
        12:12 design protocols synced. Kya command hai?
      </div>
    </div>
    
    <div class="chips" id="chips">
      <div class="chip" data-q="Scan my face.">👁️ Scan Area</div>
      <div class="chip" data-q="Plexus diagnostic run karo.">🧠 Diagnostics</div>
      <div class="chip" data-q="System architecture kya hai?">📊 System Info</div>
    </div>
  </div>

  <div class="inp-area">
    <div class="inp-row">
      <button class="ibtn ibtn-mic" id="btnVoice">🎙️</button>
      <div class="inp-box">
        <textarea id="inp" placeholder="Message Pika..." rows="1"></textarea>
      </div>
      <button class="ibtn ibtn-send" id="btnSend">➤</button>
    </div>
    <div class="vhint" id="vHint">Listening...</div>
  </div>

</div>

<script>
/* ═════════════════════════════════════════════════════════════
   THE MASTERPIECE: 3D TOPOGRAPHICAL PLEXUS ENGINE
   Combines dense topographical face mapping with high-res 
   features and interconnected neural logic.
═════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('faceCanvas');
const ctx = canvas.getContext('2d', { alpha: true });
const container = document.getElementById('avContainer');

let W, H;
let particles = [];

// Base Colors derived from the 12:12 reference
const cCyan = {r: 0, g: 230, b: 255}; // Base 3D Mesh
const cGreen = {r: 57, g: 255, b: 20}; // Neon Green Features (Eyes/Lips)
const cYellow = {r: 255, g: 240, b: 0}; // Neural Crown / Pupils

class Particle {
  constructor(x, y, r, color, type) {
    this.ox = x; this.oy = y; 
    // Initial spawn scatter for cool boot effect
    this.x = x + (Math.random() - 0.5) * 100; 
    this.y = y + (Math.random() - 0.5) * 100;
    this.r = r;
    this.color = color;
    this.type = type; 
    
    this.vx = 0; this.vy = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.015 + Math.random() * 0.02;
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = container.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;
  buildHologram();
}
window.addEventListener('resize', resize);

// Advanced 3D-Simulation Builder
function buildHologram() {
  particles = [];
  
  const cx = W / 2;
  const cy = H / 2 - 25; // Adjusted for status text
  const scale = Math.min(W, H) / 360; 
  
  // 1. NEURAL CROWN (The Yellow Brain part)
  for(let i=0; i<160; i++) {
    const angle = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * 65 * scale; 
    const px = cx + Math.cos(angle) * rad;
    const py = cy - 95 * scale + Math.sin(angle) * (rad * 0.5);
    particles.push(new Particle(px, py, Math.random() * 1.5 + 0.5, cYellow, 'brain'));
  }

  // Helper: Draw Thick Multi-layered Bezier Curves for intense features
  function drawThickFeature(x0, y0, cx1, cy1, x1, y1, steps, color, type, baseSize, layers) {
    for(let i=0; i<=steps; i++) {
      let t = i / steps;
      let bx = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx1 + t*t*x1;
      let by = (1-t)*(1-t)*y0 + 2*(1-t)*t*cy1 + t*t*y1;
      for(let l=0; l<layers; l++) {
        let scatter = l * 1.5 * scale;
        let jx = (Math.random()-0.5) * scatter;
        let jy = (Math.random()-0.5) * scatter;
        particles.push(new Particle(bx+jx, by+jy, baseSize * Math.random() + 0.5, color, type));
      }
    }
  }

  // 2. TOPOGRAPHICAL FACE MESH (The Cyan 3D depth lines)
  // We draw horizontal slices that curve downwards to simulate a cylindrical/spherical face
  for(let row=0; row<=28; row++) {
     let t = row/28; 
     let y = cy - 65*scale + t * 190*scale; // Head top to chin
     
     // Calculate head width at this height (Sine curve makes it egg-shaped)
     let w = Math.sin(t * Math.PI) * 90 * scale;
     if(t > 0.6) w *= (1 - (t-0.6)*1.4); // Taper jawline sharply

     let steps = Math.floor(w / (1.5 * scale)); // Dense point distribution
     if(steps > 5) {
       for(let i=0; i<=steps; i++) {
         let xt = i/steps; 
         let px = cx - w + (xt * w * 2);
         
         // Simulated Z-depth (curve downwards in middle)
         let depthCurve = Math.sin(xt * Math.PI);
         let py = y + depthCurve * 18 * scale;
         
         // Create empty sockets for eyes/nose to make features pop
         let nx = (px - cx)/(90*scale);
         let ny = (py - cy)/(120*scale);
         let isEye = Math.abs(nx) > 0.22 && Math.abs(nx) < 0.65 && ny > -0.28 && ny < -0.05;
         let isNose = Math.abs(nx) < 0.2 && ny > -0.1 && ny < 0.45;
         let isMouth = Math.abs(nx) < 0.4 && ny > 0.5 && ny < 0.7;

         if(!isEye && !isNose && !isMouth) {
           // We classify this as 'face_mesh' for drawing plexus lines later
           particles.push(new Particle(px, py, 0.8, cCyan, 'face_mesh'));
         }
       }
     }
  }

  // 3. JAWLINE & CHEEK DEFINITION
  drawThickFeature(cx - 85*scale, cy - 10*scale, cx - 85*scale, cy + 80*scale, cx, cy + 125*scale, 50, cCyan, 'face_edge', 1.2, 4);
  drawThickFeature(cx + 85*scale, cy - 10*scale, cx + 85*scale, cy + 80*scale, cx, cy + 125*scale, 50, cCyan, 'face_edge', 1.2, 4);

  // 4. EYES (Neon Green with Yellow Pupils)
  // Left
  drawThickFeature(cx - 60*scale, cy - 22*scale, cx - 40*scale, cy - 38*scale, cx - 18*scale, cy - 15*scale, 25, cGreen, 'eye', 1.2, 3);
  drawThickFeature(cx - 60*scale, cy - 22*scale, cx - 40*scale, cy - 12*scale, cx - 18*scale, cy - 15*scale, 25, cGreen, 'eye', 1.2, 2);
  for(let i=0; i<35; i++){
     let a = Math.random()*Math.PI*2;
     let r = Math.random()*7*scale;
     particles.push(new Particle(cx - 40*scale + Math.cos(a)*r, cy - 24*scale + Math.sin(a)*r, 1.5, cYellow, 'pupil'));
  }
  // Right
  drawThickFeature(cx + 60*scale, cy - 22*scale, cx + 40*scale, cy - 38*scale, cx + 18*scale, cy - 15*scale, 25, cGreen, 'eye', 1.2, 3);
  drawThickFeature(cx + 60*scale, cy - 22*scale, cx + 40*scale, cy - 12*scale, cx + 18*scale, cy - 15*scale, 25, cGreen, 'eye', 1.2, 2);
  for(let i=0; i<35; i++){
     let a = Math.random()*Math.PI*2;
     let r = Math.random()*7*scale;
     particles.push(new Particle(cx + 40*scale + Math.cos(a)*r, cy - 24*scale + Math.sin(a)*r, 1.5, cYellow, 'pupil'));
  }

  // 5. NOSE (Cyan details)
  drawThickFeature(cx, cy - 15*scale, cx, cy + 25*scale, cx, cy + 45*scale, 30, cCyan, 'nose', 1.2, 3); // Bridge
  drawThickFeature(cx - 16*scale, cy + 35*scale, cx, cy + 48*scale, cx + 16*scale, cy + 35*scale, 20, cCyan, 'nose', 1.0, 2); // Nostrils
  drawThickFeature(cx - 10*scale, cy + 46*scale, cx, cy + 52*scale, cx + 10*scale, cy + 46*scale, 15, cCyan, 'nose', 1.2, 2); // Tip

  // 6. LIPS (Neon Green)
  drawThickFeature(cx - 28*scale, cy + 65*scale, cx, cy + 58*scale, cx + 28*scale, cy + 65*scale, 30, cGreen, 'lip_t', 1.2, 3); 
  drawThickFeature(cx - 28*scale, cy + 65*scale, cx, cy + 68*scale, cx + 28*scale, cy + 65*scale, 30, cGreen, 'lip_t', 1.0, 2); 
  drawThickFeature(cx - 24*scale, cy + 66*scale, cx, cy + 78*scale, cx + 24*scale, cy + 66*scale, 30, cGreen, 'lip_b', 1.5, 4); // Thicker bottom lip

  // 7. AMBIENT HOLOGRAPHIC DUST
  for(let i=0; i<200; i++) {
    particles.push(new Particle(Math.random()*W, Math.random()*H, Math.random()*1.5, cCyan, 'dust'));
  }
}

let currentExpr = 'ready';
let time = 0;
let touchX = -1000, touchY = -1000;
let isTouching = false;
let isBlinking = false;

// Blink Engine
setInterval(() => {
  isBlinking = true;
  setTimeout(() => { isBlinking = false; }, 150);
}, 3500);

// Touch interaction
canvas.addEventListener('touchstart', (e) => { 
  e.preventDefault(); isTouching = true; 
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY - container.getBoundingClientRect().top; 
}, {passive: false});
canvas.addEventListener('touchmove', (e) => { 
  e.preventDefault();
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY - container.getBoundingClientRect().top; 
}, {passive: false});
canvas.addEventListener('touchend', () => { isTouching = false; touchX = -1000; });
canvas.addEventListener('mousedown', (e) => { isTouching = true; touchX = e.offsetX; touchY = e.offsetY; });
canvas.addEventListener('mousemove', (e) => { if(isTouching){ touchX = e.offsetX; touchY = e.offsetY; } });
canvas.addEventListener('mouseup', () => { isTouching = false; touchX = -1000; });
canvas.addEventListener('mouseleave', () => { isTouching = false; touchX = -1000; });

function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, W, H);
  time++;

  ctx.globalCompositeOperation = 'screen'; 

  // --- DRAW PLEXUS NETWORKS ---
  ctx.lineWidth = 0.5;
  
  // Brain Plexus (Yellow)
  const brainNodes = particles.filter(p => p.type === 'brain');
  for(let i=0; i<brainNodes.length; i++) {
    for(let j=i+1; j<brainNodes.length; j++) {
      let dx = brainNodes[i].x - brainNodes[j].x;
      let dy = brainNodes[i].y - brainNodes[j].y;
      let distSq = dx*dx + dy*dy;
      if(distSq < 1500) { 
        let alpha = 1 - (Math.sqrt(distSq) / 38);
        ctx.strokeStyle = `rgba(255, 240, 0, ${alpha * 0.6})`;
        ctx.beginPath(); ctx.moveTo(brainNodes[i].x, brainNodes[i].y); ctx.lineTo(brainNodes[j].x, brainNodes[j].y); ctx.stroke();
      }
    }
  }

  // Face Mesh Plexus (Cyan - Draws the wireframe look)
  // Optimization: Only connect a subset of mesh nodes
  const meshNodes = particles.filter(p => p.type === 'face_mesh');
  for(let i=0; i<meshNodes.length; i+=4) { 
    for(let j=i+1; j<i+12 && j<meshNodes.length; j++) {
      let dx = meshNodes[i].x - meshNodes[j].x;
      let dy = meshNodes[i].y - meshNodes[j].y;
      let distSq = dx*dx + dy*dy;
      if(distSq < 300) { 
        ctx.strokeStyle = `rgba(0, 230, 255, 0.2)`;
        ctx.beginPath(); ctx.moveTo(meshNodes[i].x, meshNodes[i].y); ctx.lineTo(meshNodes[j].x, meshNodes[j].y); ctx.stroke();
      }
    }
  }

  // --- UPDATE & DRAW PARTICLES ---
  const scale = Math.min(W, H) / 360; 
  const eyeCenterY = (H / 2 - 25) - 20*scale;

  particles.forEach(p => {
    // 1. Organic Breathing
    let breathX = Math.sin(time * p.speed + p.phase) * 1.5;
    let breathY = Math.cos(time * p.speed + p.phase) * 1.5;

    // 2. Speaking Animation (Move Jaw/Lips down)
    let speakOffset = 0;
    if (currentExpr === 'speaking' && (p.type === 'lip_b' || (p.type === 'face_edge' && p.oy > (H/2 - 25) + 60*scale))) {
       speakOffset = Math.sin(time * 0.4) * 6 * scale; 
    }

    // 3. Touch Repulsion Swirl
    let dx = touchX - p.x;
    let dy = touchY - p.y;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 80) {
      let force = (80 - dist) / 80;
      p.vx -= (dx / dist) * force * 2.5;
      p.vy -= (dy / dist) * force * 2.5;
    }

    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.82; p.vy *= 0.82; // Friction

    // 4. Target positioning with Blinking
    let targetX = p.ox + breathX;
    let targetY = p.oy + breathY + speakOffset;
    
    if(isBlinking && (p.type === 'eye' || p.type === 'pupil')) {
        targetY = eyeCenterY + (targetY - eyeCenterY) * 0.1; // Squash to center
    }
    
    p.x += (targetX - p.x) * 0.12;
    p.y += (targetY - p.y) * 0.12;

    // 5. Render
    let glow = (p.type === 'brain' || p.type === 'pupil' || p.type === 'lip_t' || p.type === 'lip_b') ? 10 : 3;
    ctx.shadowBlur = glow;
    ctx.shadowColor = `rgb(${p.color.r}, ${p.color.g}, ${p.color.b})`;
    ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${p.type==='dust'?0.4:0.95})`;
    
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
}

resize();
animate();

/* ═════════════════════════════════════════════════════════════
   UI & CHAT LOGIC
═════════════════════════════════════════════════════════════ */
const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const btnSend = document.getElementById('btnSend');
const statusTxt = document.getElementById('avStatusText');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="mmeta">${role==='user'?'You':'Pika'} · Now</div><div class="mbub">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function setStatus(status) {
  currentExpr = status;
  statusTxt.textContent = status === 'ready' ? 'READY' : (status === 'thinking' ? 'PROCESSING' : 'SPEAKING');
  statusTxt.style.color = status === 'speaking' ? 'var(--g-bright)' : (status === 'thinking' ? 'var(--a)' : 'var(--c)');
}

btnSend.addEventListener('click', () => {
  const text = inp.value.trim();
  if(!text) return;
  addMessage('user', text);
  inp.value = '';
  inp.style.height = 'auto'; 
  
  setStatus('thinking');
  
  setTimeout(() => {
    setStatus('speaking');
    addMessage('pika', 'Plexus synced successfully. Main screen scan kar rahi hoon...');
    setTimeout(() => setStatus('ready'), 3000);
  }, 1200);
});

inp.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
});

document.getElementById('chips').addEventListener('click', (e) => {
  if(e.target.classList.contains('chip')) { inp.value = e.target.dataset.q; btnSend.click(); }
});

document.querySelectorAll('button').forEach(b => {
  b.addEventListener('touchend', (e) => { e.preventDefault(); b.click(); });
});
</script>
